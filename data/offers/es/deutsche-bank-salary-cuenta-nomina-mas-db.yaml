id: deutsche-bank-salary-cuenta-nomina-mas-db
bank: Deutsche Bank España
bank_slug: deutsche-bank
country: ES
goal: salary
product_name: Cuenta Nómina Más DB
headline: EUR 500 gross (EUR 405 net) over 12 months for a payroll or pension of EUR 2,000+ a month
reward:
  type: cash
  value_eur: 500
  description: EUR 500 gross, which the bank states as EUR 405 net, paid as EUR 33.75 net a month for up to 12 months in the Cuenta Nómina Más DB.
  paid_when: Monthly in arrears, in the first 15 days of the following month, for up to 12 months
rate_tae: null
promo_months: 12
balance_cap_eur: null
commitment_months: 12
requirements:
  min_monthly_income_eur: 2000
  new_customer_only: true
  other:
    - Payroll or pension of EUR 2,000+ a month; summed incomes, cash deposits and transfers between own accounts do not count
    - Average monthly balance of EUR 3,000+ in the Cuenta Nómina Más DB during the 12 months
    - Not combinable with other Deutsche Bank payroll, pension or SEPE offers
    - Customer who has never been a Deutsche Bank customer
fees:
  monthly_eur: 0
  notes: No maintenance fee while the payroll of EUR 2,000+ a month is domiciled, or while accounts + deposits + investments total EUR 10,000+. Otherwise EUR 60 per quarter (EUR 240 per year). Free euro transfers via app or online, free card issue and renewal for 2 credit and 2 debit cards, free cash withdrawals at any ATM worldwide when the ATM owner itemises the fee.
penalty: Payment stops if either condition is missed in a month; no clawback of paid instalments is stated
eligibility:
  residents_only: null
  nie_tie_ok: null
  non_residents: null
  notes: The page does not state residency or NIE/TIE rules. The contact form asks for a DNI.
valid_until: null
