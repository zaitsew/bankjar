notes: The same Cuenta Más DB page advertises "up to EUR 6,500" in total (EUR 500 payroll plus "up to EUR 6,000 for bringing your savings"); the savings part is not itemised on the pages fetched, so it is not included here. The bank gives -4.714% TAE as an example if no condition is met and the balance is EUR 5,000. The sister page cuentas-tarjetas/cuentas/mas-db.html shows the savings account at 2% TAE up to EUR 150,000, so the savings band differs between DB pages.
