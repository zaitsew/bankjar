<svg xmlns="http://www.w3.org/2000/svg" width="880" height="188" viewBox="0 0 880 188" role="img" aria-label="How it works. 1. Ask. Type a goal: salary, savings, account, deposit or bonus. 2. Parse. AI or a rule parser turns the words into a profile. 3. Rank. One engine scores every offer in first-year net euros. 4. Check. Read each catch, then open the bank&#x27;s own source link.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#14161D}.m{fill:#585E6D}.cap{font-size:11px;letter-spacing:.06em}.b{font-weight:600}</style>
<rect x="0.5" y="0.5" width="879" height="187" rx="12" fill="#FFFFFF" stroke="#DCDEE5"/>
<line x1="90.0" x2="230.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="60.0" cy="52" r="20" fill="#EFC455"/>
<text class="b" x="60.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">1</text>
<text class="b" x="40.0" y="98" font-size="15.5">Ask</text>
<text class="m" x="40.0" y="120" font-size="13.5">Type a goal: salary,</text>
<text class="m" x="40.0" y="139" font-size="13.5">savings, account, deposit or</text>
<text class="m" x="40.0" y="158" font-size="13.5">bonus.</text>
<line x1="290.0" x2="430.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="260.0" cy="52" r="20" fill="#EFC455"/>
<text class="b" x="260.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">2</text>
<text class="b" x="240.0" y="98" font-size="15.5">Parse</text>
<text class="m" x="240.0" y="120" font-size="13.5">AI or a rule parser turns the</text>
<text class="m" x="240.0" y="139" font-size="13.5">words into a profile.</text>
<line x1="490.0" x2="630.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="460.0" cy="52" r="20" fill="#EFC455"/>
<text class="b" x="460.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">3</text>
<text class="b" x="440.0" y="98" font-size="15.5">Rank</text>
<text class="m" x="440.0" y="120" font-size="13.5">One engine scores every</text>
<text class="m" x="440.0" y="139" font-size="13.5">offer in first-year net euros.</text>
<circle cx="660.0" cy="52" r="20" fill="#EFC455"/>
<text class="b" x="660.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">4</text>
<text class="b" x="640.0" y="98" font-size="15.5">Check</text>
<text class="m" x="640.0" y="120" font-size="13.5">Read each catch, then open</text>
<text class="m" x="640.0" y="139" font-size="13.5">the bank&#x27;s own source link.</text>
</svg>
